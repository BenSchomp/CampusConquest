<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Conquest</title>
<meta name="description" content="Campus Conquest (2001), a point-and-click adventure set on the University of Rhode Island campus, running in the browser.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none;
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #screen { display: block; background: #000; }
  #start { position: fixed; inset: 0; cursor: pointer; }
  #start.hidden { display: none; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="480"></canvas>
<div id="start" aria-label="Click to start"></div>
<script src="engine.js"></script>
</body>
</html>
