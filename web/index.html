<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Conquest</title>
<meta name="description" content="Campus Conquest (2001), a point-and-click adventure set on the University of Rhode Island campus, running in the browser.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none;
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #screen { display: block; background: #000; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 18px; color: #d9822b; font: 600 22px/1.3 Georgia, serif; cursor: pointer; text-align: center; padding: 16px; }
  #start small { color: #888; font: 14px/1.4 system-ui, sans-serif; max-width: 420px; }
  #start.hidden { display: none; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="480"></canvas>
<div id="start">
  <div>Campus Conquest</div>
  <div style="font-size:16px;color:#ccc">Click to start</div>
  <small>Originally released in 2001 for Windows and DirectX. Rebuilt for the web from the original game data and artwork.</small>
</div>
<script src="engine.js"></script>
</body>
</html>
